databases:
  - name: research-paper-db
    databaseName: research_intel
    user: research_intel
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: research-paper-api
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: research-paper-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: research-paper-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        fromService:
          name: research-paper-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: research-paper-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: research-paper-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
